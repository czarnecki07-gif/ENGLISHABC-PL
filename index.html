<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angielski dla Polaków – Kurs A1–C1</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🇬🇧 Angielski dla Polaków</h1>
  <p class="subtitle">Kurs A1 → C1 · Gramatyka i Tematyka · 192 lekcje</p>
  <div class="controls">
    <input type="search" id="search" placeholder="🔍 Szukaj lekcji...">
    <select id="voiceSelect" title="Głos"></select>
    <label class="rate-label">Tempo
      <input type="range" id="rate" min="0.5" max="1.5" step="0.1" value="1">
    </label>
    <button id="stopBtn" title="Zatrzymaj">⏹ Stop</button>
  </div>
</header>

<nav id="tabs">
  <button class="tab active" data-section="G">📘 Gramatyka</button>
  <button class="tab" data-section="T">💬 Tematyka</button>
</nav>

<main id="content"></main>

<footer>
  <p>© Kurs angielskiego dla Polaków · Odsłuch: Web Speech API</p>
</footer>

<!-- ===== MODAL LEKCJI ===== -->
<div id="modal" class="modal hidden">
  <div class="modal-content">
    <div class="modal-header">
      <h2 id="modalTitle"></h2>
      <button id="closeModal" title="Zamknij">✖</button>
    </div>

    <div class="modal-toolbar">
      <button id="readAllBtn">▶ Czytaj cały tekst</button>
      <button id="readSelectionBtn">🔊 Czytaj zaznaczone</button>
      <button id="pausePdf">⏸ Pauza</button>
      <button id="stopPdf">⏹ Stop</button>
      <span class="toolbar-hint">💡 Kliknij dowolne słowo w PDF, aby je usłyszeć</span>
    </div>

    <div id="pdfContainer">
      <div id="pdfPages" class="pdf-pages"></div>
    </div>

    <div class="dictionary">
      <h3>📖 Słownik lekcji</h3>
      <div class="dict-input">
        <input type="text" id="wordInput" placeholder="Wpisz słowo angielskie...">
        <button id="addWord">➕ Dodaj</button>
        <button id="translateBtn">🌐 Przetłumacz i dodaj</button>
      </div>
      <ul id="wordList"></ul>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
